<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOOM</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Tahoma, "Segoe UI", sans-serif;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at top, rgba(160, 56, 20, 0.28), transparent 44%),
          #000;
      }

      #dosbox {
        width: 100%;
        height: 100%;
      }

      .dosbox-container,
      .dosbox-container canvas,
      .dosbox-container .dosbox-overlay {
        width: 100% !important;
        height: 100% !important;
      }

      .dosbox-container .dosbox-overlay {
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.75)),
          #000 url("/icons/doom-logo.png") center center / min(60%, 420px) auto no-repeat !important;
      }

      #status {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 16px;
        padding: 8px 10px;
        border: 1px solid rgba(202, 110, 65, 0.7);
        background: rgba(0, 0, 0, 0.7);
        color: #f3d19e;
        font-size: 12px;
        line-height: 1.4;
        z-index: 10;
      }

      #status.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="dosbox"></div>
      <div id="status">Loading DOOM. Tunggu beberapa detik lalu klik area game.</div>
    </div>

    <script src="https://js-dos.com/cdn/js-dos-api.js"></script>
    <script>
      (function () {
        var status = document.getElementById("status");

        function setStatus(message, autoHide) {
          status.textContent = message;
          status.classList.remove("hidden");

          if (autoHide) {
            window.setTimeout(function () {
              status.classList.add("hidden");
            }, 3200);
          }
        }

        if (typeof Dosbox === "undefined") {
          setStatus("DOOM gagal dimuat. Buka di tab baru atau cek koneksi internet.", false);
          return;
        }

        var dosbox = new Dosbox({
          id: "dosbox",
          root: "https://js-dos.com/cdn/",
          kiosk: true,
          onload: function (instance) {
            setStatus("Engine siap. Memuat DOOM...", false);
            instance.run(
              "https://js-dos.com/cdn/upload/DOOM-@evilution.zip",
              "./doom"
            );
          },
          onrun: function () {
            setStatus("DOOM siap dimainkan. Klik area game agar input keyboard aktif.", true);
          },
        });

        window.doomDosbox = dosbox;
      })();
    </script>
  </body>
</html>
